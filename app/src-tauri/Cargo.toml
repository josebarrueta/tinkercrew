[package]
name = "tinkercrew"
version = "0.1.0"
description = "A local-first cooperative maker game for family crews"
authors = ["TinkerCrew contributors"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tinkercrew_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["sync", "time", "process", "net", "rt", "fs", "io-util"] }
security-framework = "3.7.0"
mdns-sd = "0.21.6"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
zeroize = "1.9.1"
base64 = "0.23.1"
sha2 = "0.11.1"
wait-timeout = "0.2.1"
fs2 = "0.4.3"
libc = "0.2.191"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
